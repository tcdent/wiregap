[package]
name = "directpath"
version = "0.0.0"
edition = "2024"
publish = false

# The pure-direct control module (ixy pci.c/memory.c shape) — Sprint 6. A userspace process on running
# Linux that takes the bench NIC and drives it directly. This crate's PRIMARY safety leg is the pure
# `gate` (below): every state-changing op (unbind/BME/mmap/DMA, Part B) routes through it. std (userspace).
[dependencies]
libc = "0.2"
# Isolated verification/measurement tooling for the bench HARNESSES only (self-hashing run provenance, core
# pinning, the APERF idle instrument). Used by the src/bin/ harnesses; the production modules do not touch it.
benchtools = { path = "../benchtools" }
# The E3 driver crate: the confined volatile DMA rings (VolatileRxRing/TxRing) + the RxDrain copy-out seam
# (RxPath). Slice 4 drives the real device through these over the datapath bring-up (src/datapath.rs).
driver = { path = "../driver" }
# Sprint 7: the moved reactor (Host/RxSource/TransmitSink seams + the loop) and the transport (Instant,
# SessionTable). directpath supplies the bounded-poll Host + the Ethernet encap/decap wiring behind the seams.
reactor = { path = "../reactor" }
transport = { path = "../transport" }

[dev-dependencies]
