[package]
name = "proxy"
version = "0.0.0"
edition = "2024"
publish = false

# The security-invariant core (Sprint 5). Reuses proto's committed primitives — scan_safe,
# SafeSegment(Stack), NetAddress, Scheme, Reassembler — as a real dependency; it never rebuilds
# them. Feature-scoped to file+net (the proxy never compiles the terminal/control grammar —
# proto's own surface-minimization). directpath/reactor/transport deps arrive later with the
# transport seam (out of Sprint-5 scope).
[dependencies]
# Sprint 6 (dispatch): the demux routes ALL verb blocks (control/terminal/file/net), so proto's
# full feature set is linked (Sprint 5's file+net was the tier-1-core-only surface).
proto = { path = "../proto", features = ["control", "terminal", "file", "net"] }
# The transport seam Sprint 5 deferred — now wired. `transport` for SessionId/SessionTable/Delivery,
# `reactor` for the driving loop (pump_all).
transport = { path = "../transport" }
reactor = { path = "../reactor" }
# Sprint 8: the real NIC — first contact. Default features only (the `bench` internals hatch stays
# compile-absent from the TCB build). The proxy abstracts its serving surface behind the `nic::NicRun`
# trait so lifecycle sequencing stays testable against a fake; only real construct/run need hardware.
directpath = { path = "../directpath" }
# Optional, ONLY for the Slice-5 bench-capture bin: benchtools' Provenance (self-hashed bin-sha) +
# nonce. Off by default — the production lib never links it.
benchtools = { path = "../benchtools", optional = true }
ureq = "3.3.0"

[features]
# The Slice-5 receive-path e2e capture bin (src/bin/s5_capture.rs). Enables directpath's `bench`
# internals (the `two_facade` two-instance harness) + benchtools. OFF BY DEFAULT so `cargo build`
# (the production/TCB build) never links the bench surface — only `--features bench-capture` does.
bench-capture = ["directpath/bench", "dep:benchtools"]

# The Sprint-13 composition-root binary (src/bin/serve.rs) — the first runnable proxy. A pure BIN gate
# (no extra deps: the RealNic construct, HeadConnection, and AnthropicClient are all in the default lib),
# so it enables no feature flags — it only makes the bin buildable. OFF BY DEFAULT so `cargo build` (the
# production/TCB build) never compiles this hardware-touching binary; only `--features serve` does.
# Reuses s5_capture's feature-gated posture (compile-absent from a normal build).
serve = []

# The one confined-unsafe dependency: raw openat2/mkdirat syscalls for U1's open-discipline
# (RQ7 → Option A, design 2026-07-19: box-reachable code carries confined IN-HOUSE unsafe,
# never a third-party wrapper — reviewability is the guarantee, not a zero-unsafe-token count).
# `unsafe` is confined to the one `open_discipline` module (crate root is deny(unsafe_code)).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# trybuild drives the U5 compile-fail (C1) gate — a malformed route/identity, and the struct-literal
# bypass, must each FAIL to compile against a pinned .stderr. Proto's own tests/trybuild.rs pattern.
[dev-dependencies]
trybuild = "1"

# The Slice-5 bench-capture bin — declared so its required-features gate it off the default build.
[[bin]]
name = "s5_capture"
required-features = ["bench-capture"]

# The Sprint-13 composition-root bin — declared so its required-features gate it off the default build.
[[bin]]
name = "serve"
required-features = ["serve"]
