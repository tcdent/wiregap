[package]
name = "proxy"
version = "0.0.0"
edition = "2024"
publish = false

# The security-invariant core (Sprint 5). Reuses proto's committed primitives — scan_safe,
# SafeSegment(Stack), NetAddress, Scheme, Reassembler — as a real dependency; it never rebuilds
# them. Feature-scoped to file+net (the proxy never compiles the terminal/control grammar —
# proto's own surface-minimization). directpath/reactor/transport deps arrive later with the
# transport seam (out of Sprint-5 scope).
[dependencies]
# Sprint 6 (dispatch): the demux routes ALL verb blocks (control/terminal/file/net), so proto's
# full feature set is linked (Sprint 5's file+net was the tier-1-core-only surface).
proto = { path = "../proto", features = ["control", "terminal", "file", "net"] }
# The transport seam Sprint 5 deferred — now wired. `transport` for SessionId/SessionTable/Delivery,
# `reactor` for the driving loop (pump_all). `directpath` (the real NIC) stays a fill-in; the relays
# and dispatch are tested against a fake wire (the transport crate's own test pattern).
transport = { path = "../transport" }
reactor = { path = "../reactor" }

# The one confined-unsafe dependency: raw openat2/mkdirat syscalls for U1's open-discipline
# (RQ7 → Option A, design 2026-07-19: box-reachable code carries confined IN-HOUSE unsafe,
# never a third-party wrapper — reviewability is the guarantee, not a zero-unsafe-token count).
# `unsafe` is confined to the one `open_discipline` module (crate root is deny(unsafe_code)).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# trybuild drives the U5 compile-fail (C1) gate — a malformed route/identity, and the struct-literal
# bypass, must each FAIL to compile against a pinned .stderr. Proto's own tests/trybuild.rs pattern.
[dev-dependencies]
trybuild = "1"
